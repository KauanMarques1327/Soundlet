<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="upperBlue" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#002968" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#00132F" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000A14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lowerBlue" cx="1" cy="1" r="0.85">
      <stop offset="0" stop-color="#00236A" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#001537" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000A14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed background: Android applies the launcher mask and rounded corners. -->
  <rect width="512" height="512" fill="#000A14"/>
  <rect width="512" height="512" fill="url(#upperBlue)"/>
  <rect width="512" height="512" fill="url(#lowerBlue)"/>
</svg>
